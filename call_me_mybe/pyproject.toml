[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Large Language Models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk>=1.0.1",
    "numpy>=2.2.6",
    "pydantic>=2.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["moulinette"]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "mypy>=2.1.0",
]